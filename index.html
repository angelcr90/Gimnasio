<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V-Taper Lab">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link id="fav-icon" rel="icon" href="">
<title>V-Taper & Arm Code — Performance Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
html{overflow-x:hidden}
body{overflow-x:clip;max-width:100%;background:#0A0B0E;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;font-size:18px;letter-spacing:-0.01em}
body.light{background:#F4F5F7;color:#111827}
:root{
  --bg:#0A0B0E;--bg2:#12141A;--bg3:#1A1D26;--bg4:#232734;
  --glass:rgba(26,29,38,0.78);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#F3F4F6;--text2:#9CA3AF;--text3:#6B7280;
  --accent:#00F0FF;--accent-glow:rgba(0,240,255,0.18);--accent2:#00C8D6;
  --lime:#B8FF3B;--lime-glow:rgba(184,255,59,0.18);
  --push:#3B82F6;--pull:#10B981;--legs:#F59E0B;--arms:#EC4899;
  --danger:#EF4444;--warm:#F59E0B;
}
body.light{
  --bg:#F4F5F7;--bg2:#FFFFFF;--bg3:#F3F4F6;--bg4:#E5E7EB;
  --glass:rgba(255,255,255,0.88);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#111827;--text2:#4B5563;--text3:#9CA3AF;
  --accent:#0284C7;--accent-glow:rgba(2,132,199,0.12);--accent2:#0369A1;
}

/* HEADER WHOOP STYLE */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;gap:8px}
.hdr-brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.hdr-title{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hdr-timer{font-size:15px;font-weight:700;color:var(--lime);background:var(--lime-glow);border:1px solid rgba(184,255,59,0.3);border-radius:20px;padding:4px 10px;font-variant-numeric:tabular-nums;cursor:pointer}
.icon-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;line-height:1}

/* FOLDER & SESSION BAR */
.folder-back-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.folder-back-btn{padding:5px 11px;border-radius:16px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.folder-cur-lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.folder-picker-title{font-size:22px;font-weight:800;margin:8px 0 6px;letter-spacing:-0.02em}
.folder-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:transform .15s,border-color .15s}
.folder-card:active{transform:scale(0.98)}
.folder-card.cur{border-color:var(--accent);background:linear-gradient(135deg,var(--bg2) 0%,var(--accent-glow) 100%)}
.folder-ico{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:12px;flex-shrink:0}
.folder-info{flex:1;min-width:0}
.folder-lbl{font-size:16px;font-weight:700;color:var(--text)}
.folder-sub{font-size:13px;color:var(--text2);margin-top:3px}
.folder-check{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-glow);padding:4px 10px;border-radius:12px}

.sess-bar{display:flex;gap:8px;padding:12px 16px;background:var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sess-bar::-webkit-scrollbar{display:none}
.sess-pill{display:flex;flex-direction:column;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);white-space:nowrap;flex-shrink:0;user-select:none;transition:all .15s;cursor:pointer;min-width:125px}
.sess-pill.sel{border-color:var(--accent);background:linear-gradient(180deg,var(--bg3) 0%,var(--accent-glow) 100%);box-shadow:0 4px 14px rgba(0,0,0,0.3)}
.sess-pill.locked{opacity:.35;cursor:not-allowed}
.sess-pill.active-sess{border-color:var(--lime);background:linear-gradient(180deg,var(--bg3) 0%,var(--lime-glow) 100%)}
.sp-label{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.sp-push{color:var(--push)}.sp-pull{color:var(--pull)}.sp-legs{color:var(--legs)}.sp-arms{color:var(--arms)}
.sp-sub{font-size:11.5px;color:var(--text2);margin-top:3px}

.main{padding:8px 16px 110px;max-width:540px;margin:0 auto}
.slbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* SUPERSET GROUPING */
.ss-group{border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:16px;padding:8px;margin-bottom:14px;background:rgba(255,255,255,0.015)}
.ss-group-hdr{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ss-group .exc{margin-bottom:6px;border-radius:12px}
.ss-group .exc:last-child{margin-bottom:0}

/* START BANNER */
.start-banner{background:linear-gradient(145deg,var(--bg2),var(--bg3));border:1px solid var(--border2);border-radius:18px;padding:20px;text-align:center;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,0.25)}
.start-banner p{font-size:14.5px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.start-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#0A0B0E;font-size:15.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px var(--accent-glow)}
.start-btn:active{transform:scale(0.98)}
.past-btn{margin-top:10px;padding:8px 14px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}

/* EXERCISE CARD */
.exc{background:var(--bg2);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.exc.open{border-color:var(--border2)}
.exh{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;gap:10px;user-select:none}
.exname{font-size:15.5px;font-weight:700;flex:1;min-width:0;line-height:1.3;color:var(--text)}
.exright{display:flex;align-items:center;gap:6px;flex-shrink:0}
.exscheme{font-size:12px;font-weight:700;color:var(--text2);background:var(--bg3);padding:4px 8px;border-radius:8px;border:1px solid var(--border)}
.exarrow{font-size:12px;color:var(--text3);transition:transform .2s;margin-left:2px}
.exc.open .exarrow{transform:rotate(180deg)}
.exprog{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--bg4);color:var(--text2)}
.exprog.done{background:var(--lime-glow);color:var(--lime);border:1px solid rgba(184,255,59,0.3)}
.warm-tag{font-size:10px;font-weight:700;color:var(--warm);margin-left:2px}

.exbadges{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em}
.b-drop{background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.3)}
.b-rp{background:rgba(245,158,11,.15);color:#FBBF24;border:1px solid rgba(245,158,11,.3)}
.b-bi{background:rgba(16,185,129,.15);color:#34D399;border:1px solid rgba(16,185,129,.3)}
.b-tri{background:rgba(245,158,11,.15);color:#FBBF24;border:1px solid rgba(245,158,11,.3)}
.b-myo{background:rgba(168,85,247,.15);color:#C084FC;border:1px solid rgba(168,85,247,.3)}
.b-clu{background:rgba(59,130,246,.15);color:#60A5FA;border:1px solid rgba(59,130,246,.3)}

.exnote{font-size:13.5px;color:var(--text2);padding:10px 14px;border-top:1px solid var(--border);line-height:1.5;background:rgba(0,0,0,0.15)}
.prevhint{font-size:12px;font-weight:600;color:var(--accent);padding:8px 14px;background:var(--accent-glow);border-top:1px solid var(--border)}
.readonly-sets{padding:10px 14px;border-top:1px solid var(--border)}
.ro-row{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--border)}
.ro-row:first-child{border-top:none}
.ro-num{font-size:12px;font-weight:700;color:var(--text3);width:18px}
.ro-val{font-size:13.5px;font-weight:600;color:var(--text2);flex:1}
.ro-badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}

/* TOOLS & SETS */
.ex-tools{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--border)}
.ex-tool-btn{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px}
.ex-tool-btn:active{background:var(--bg4);color:var(--text)}

.setsarea{padding:8px 10px 12px}
.sethdr{display:grid;grid-template-columns:22px 32px 1fr 1fr 42px 38px 28px;gap:5px;margin-bottom:6px;padding:0 2px}
.sethdr span{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.setrow{display:grid;grid-template-columns:22px 32px 1fr 1fr 42px 38px 28px;gap:5px;margin-bottom:6px;align-items:center}
.setnum{font-size:12.5px;font-weight:700;color:var(--text3);text-align:center}
.stlabel{font-size:11px;font-weight:800;padding:5px 2px;border-radius:6px;text-align:center;cursor:pointer;border:1px solid transparent;user-select:none}
.st-N{background:var(--bg4);color:var(--text2);border-color:var(--border2)}
.st-W{background:rgba(245,158,11,.15);color:#FBBF24;border-color:rgba(245,158,11,.3)}
.st-D{background:rgba(239,68,68,.15);color:#F87171;border-color:rgba(239,68,68,.3)}
.st-C{background:rgba(59,130,246,.15);color:#60A5FA;border-color:rgba(59,130,246,.3)}
.st-M{background:rgba(168,85,247,.15);color:#C084FC;border-color:rgba(168,85,247,.3)}
.st-R{background:rgba(251,146,60,.15);color:#FB923C;border-color:rgba(251,146,60,.3)}

.stepper{display:flex;align-items:center;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;overflow:hidden;height:38px}
.step-btn{width:24px;height:100%;border:none;background:transparent;color:var(--text2);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-btn:active{background:rgba(255,255,255,0.1);color:var(--accent)}
.sinp{background:transparent;border:none;font-size:16px;font-weight:700;color:var(--text);text-align:center;width:100%;min-width:0;outline:none;-webkit-appearance:none;padding:0}
.sinp::placeholder{color:var(--text3);font-weight:500}

.ririn{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;height:38px;font-size:14px;font-weight:700;color:var(--text2);text-align:center;width:100%;outline:none;-webkit-appearance:none}
.ririn:focus{border-color:var(--accent);color:var(--text)}
.setdone{width:38px;height:38px;border-radius:8px;border:1px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin:0 auto;transition:all .15s}
.setdone.chk{background:var(--lime);border-color:var(--lime);color:#0A0B0E;box-shadow:0 2px 10px var(--lime-glow)}
.setdel{width:28px;height:38px;border-radius:8px;border:none;background:transparent;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.setdel:active{color:var(--danger)}
.addsetbtn{width:100%;padding:10px;background:transparent;border:1px dashed var(--border2);border-radius:10px;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
.sub-label{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}

/* REST TIMER BAR */
.rest-hdr{position:sticky;top:var(--hdr-h,48px);z-index:199;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);margin:0 -16px 12px;padding:8px 16px;display:flex;align-items:center;gap:6px}
.rest-hdr-time{font-size:19px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:50px;cursor:pointer}
.rest-hdr-time.warn{color:var(--danger)}
.rest-hdr-time.idle{color:var(--text3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rest-hdr-btns{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;justify-content:flex-end}
.rest-hdr-btns::-webkit-scrollbar{display:none}
.rest-hdr-btn{padding:6px 8px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.rest-hdr-btn:active{background:var(--accent);color:#0A0B0E;border-color:var(--accent)}
.rest-hdr-ios{padding:6px 8px;border-radius:8px;border:1px solid rgba(0,240,255,0.35);background:var(--accent-glow);color:var(--accent);font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.rest-hdr-skip{padding:6px 8px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;cursor:pointer}

/* FINISH & NOTES */
.snwrap{margin-top:16px}
.snlbl{font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sntxt{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;color:var(--text);resize:none;min-height:60px;outline:none;font-family:inherit}
.fin-wrap{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.fin-btn{width:100%;padding:15px;border-radius:14px;border:none;font-size:15.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.fin-btn.green{background:var(--lime);color:#0A0B0E;box-shadow:0 4px 16px var(--lime-glow)}
.fin-btn.done{background:var(--lime-glow);color:var(--lime);border:1px solid rgba(184,255,59,0.3)}
.fin-btn.red{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.fin-btn.grey{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}

/* ANALYTICS & WHOOP DASHBOARD */
.pgmain,.calmain,.profmain{padding:12px 16px 110px;max-width:540px;margin:0 auto}
.pgsec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.kpi-val{font-size:24px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-val span{font-size:13px;font-weight:600;color:var(--accent);margin-left:2px}
.kpi-lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-top:4px}

.chartbox{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.charttitle{font-size:12px;font-weight:800;color:var(--text);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
.chartlegend{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.clitem{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--text2)}
.cldot{width:8px;height:8px;border-radius:50%}
canvas{display:block;width:100%}

/* PR WALL */
.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.pr-card{background:linear-gradient(145deg,var(--bg2),var(--bg3));border:1px solid var(--border2);border-radius:14px;padding:12px}
.pr-ex{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-main{font-size:18px;font-weight:800;color:var(--lime);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.pr-sub{font-size:11px;color:var(--text3);font-weight:600}

/* FILTER & CARDS */
.pgfilter{display:flex;gap:8px;margin-bottom:12px}
.pgsel{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--text);outline:none;flex:1;min-width:0;font-family:inherit}
.pgcard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.pgexname{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text)}
.pgentry{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border);gap:8px}
.pgdate{font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap}
.pgsets{font-size:13px;font-weight:600;color:var(--text);text-align:right}
.pbbadge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;background:var(--lime-glow);color:var(--lime);border-radius:5px;margin-left:5px}
.pgempty{font-size:14px;color:var(--text3);text-align:center;padding:30px 0}
.ex-summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:10px}
.ex-sum-item{text-align:center}
.ex-sum-val{font-size:16px;font-weight:800;color:var(--accent)}
.ex-sum-lbl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-top:2px}

/* CALENDAR */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:6px 14px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
.calmonth{font-size:16px;font-weight:800;letter-spacing:.02em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.caldow{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--text3);text-align:center;padding:4px 0}
.calday{min-height:44px;border-radius:10px;border:1px solid var(--border);padding:4px;cursor:pointer;background:var(--bg2);display:flex;flex-direction:column;justify-content:space-between}
.calday.empty{background:transparent;border-color:transparent;cursor:default}
.calday.today{border-color:var(--accent);background:var(--accent-glow)}
.calday.selday{outline:2px solid var(--lime)}
.cdn{font-size:12px;font-weight:700;color:var(--text2)}
.calday.today .cdn{color:var(--accent)}
.cdsess{display:flex;flex-wrap:wrap;gap:2px}
.caldot{width:7px;height:7px;border-radius:50%}
.cal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cal-stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center}
.cal-stat-val{font-size:20px;font-weight:800;color:var(--accent)}
.cal-stat-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text2);margin-top:3px}

const fmt    = s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
const fmtH   = s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`:`${m}:${String(sc).padStart(2,'0')}`;};
const haptic = p=>{try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
const normName = s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

function getCurFolder(){ return ROUTINES.find(r=>r.id===curFolder)||ROUTINES[0]; }

function getSessData(id){
  const sid=id||curSess;
  const folder=getCurFolder();
  const base=folder.sessions.find(s=>s.id===sid)||ALL_SESSIONS.find(s=>s.id===sid)||folder.sessions[0];
  const cx=customEx[sid];
  if(!cx)return base;
  const clone=JSON.parse(JSON.stringify(base));
  clone.secs.forEach(sec=>sec.ex.forEach(ex=>{if(cx[ex.id]){Object.assign(ex,cx[ex.id]);}}));
  return clone;
}

function getSets(sk,exId){
  const dk=wDate()+'_'+sk;
  if(!sessions[dk])sessions[dk]={};
  if(!sessions[dk][exId])sessions[dk][exId]={sets:[],note:''};
  return sessions[dk][exId];
}

function exDisplayName(dk,xid){
  if(sessions[dk]&&sessions[dk][xid]&&sessions[dk][xid].name)return sessions[dk][xid].name;
  return GLOBAL_EX_NAMES[xid]||xid;
}

function getPrev(sk,exId,exObj){
  const targetNames = new Set();
  if(exObj){
    targetNames.add(normName(exObj.n));
    if(exObj.aliases) exObj.aliases.forEach(a=>targetNames.add(normName(a)));
  } else {
    const nm = GLOBAL_EX_NAMES[exId];
    if(nm){
      targetNames.add(normName(nm));
      if(EX_ALIASES[nm]) EX_ALIASES[nm].forEach(a=>targetNames.add(normName(a)));
    }
  }

  const curDk = wDate()+'_'+sk;
  const allDates = Object.keys(sessions).sort().reverse();
  let fallback = null;

  for(const dk of allDates){
    if(dk >= curDk) continue;
    const dayObj = sessions[dk];
    if(!dayObj) continue;

    if(dayObj[exId] && dayObj[exId].sets && dayObj[exId].sets.length){
      if(dayObj[exId].sets.some(s=>s.done)) return dayObj[exId].sets;
      if(!fallback) fallback = dayObj[exId].sets;
    }

    if(targetNames.size > 0){
      for(const xid of Object.keys(dayObj)){
        if(xid==='__note__') continue;
        const entry = dayObj[xid];
        if(!entry || !entry.sets || !entry.sets.length) continue;
        const entryName = normName(exDisplayName(dk, xid));
        if(targetNames.has(entryName)){
          if(entry.sets.some(s=>s.done)) return entry.sets;
          if(!fallback) fallback = entry.sets;
        }
      }
    }
  }
  return fallback;
}

function countPlanned(schemeStr){
  const matches=(schemeStr||'').match(/(\d+)\s*x/gi)||[];
  const total=matches.reduce((s,m)=>s+parseInt(m),0);
  return total||3;
}

function ensurePlannedSets(sk,exId,schemeStr,exName,exObj){
  const sess=getSets(sk,exId);
  if(exName&&!sess.name){sess.name=exName;saveSess();}
  if(sess.sets.length)return sess.sets;

  const prevAll=getPrev(sk,exId,exObj);
  const prev=prevAll?prevAll.filter(s=>s.done||s.kg||s.reps):null;
  if(prev&&prev.length){
    prev.forEach(p=>{
      sess.sets.push({kg:p.kg||'',reps:p.reps||'',rir:(p.rir!==undefined?p.rir:''),rest:p.rest||'',done:false,type:p.type||'N'});
    });
    saveSess();
    return sess.sets;
  }

  const planned=countPlanned(schemeStr);
  for(let i=0;i<planned;i++){
    sess.sets.push({kg:'',reps:'',rir:'',rest:'',done:false,type:'N'});
  }
  saveSess();
  return sess.sets;
}

let audioCtx=null;
function playGymBeep(type){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);
    if(type==='tick'){
      osc.type='sine';osc.frequency.setValueAtTime(520,now);
      gain.gain.setValueAtTime(0.08,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      osc.start(now);osc.stop(now+0.12);
    } else {
      osc.type='triangle';
      osc.frequency.setValueAtTime(880,now);
      osc.frequency.setValueAtTime(1174.66,now+0.16);
      gain.gain.setValueAtTime(0.22,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.45);
      osc.start(now);osc.stop(now+0.45);
    }
  }catch(e){}
}

function startST(){
  if(stFixed!==null){stopST();stSec=stFixed;updSTUI();return;}
  if(!stStart){stStart=Date.now()-stSec*1000;sv('stStart',stStart);}
  clearInterval(stInt);stOn=true;stInt=setInterval(syncST,1000);syncST();
}
function syncST(){
  if(!stStart||stFixed!==null)return;
  stSec=Math.max(0,Math.floor((Date.now()-stStart)/1000));sv('stSec',stSec);updSTUI();
}
function stopST(){clearInterval(stInt);stInt=null;stOn=false;}
function resetST(){stopST();stSec=0;stStart=0;stFixed=null;sv('stSec',0);sv('stStart',0);sv('stFixed',null);updSTUI();}
function updSTUI(){
  const el=document.getElementById('hdr-timer');
  const show=(activeSess===curSess);
  if(el){el.style.display=show?'block':'none';el.textContent='⏱ '+fmtH(stSec);}
  const dt=document.getElementById('hdr-date');
  if(dt)dt.style.display=show?'none':'';
}

let lastBeepSec=-1;
function startRT(s){
  stopRT();rtEnd=Date.now()+s*1000;sv('rtEnd',rtEnd);rtSec=s;rtOn=true;lastBeepSec=-1;
  playGymBeep('tick');
  rtInt=setInterval(syncRT,250);updRTUI();
}
function syncRT(){
  if(!rtEnd){rtSec=0;updRTUI();return;}
  const left=Math.ceil((rtEnd-Date.now())/1000);
  if(left<=0){
    const wasRunning=rtOn;stopRT();rtSec=0;rtEnd=0;sv('rtEnd',0);lastBeepSec=-1;
    if(wasRunning){
      playGymBeep('done');
      haptic([60,40,100]);
      toast('⚡ ¡Tiempo de descanso cumplido!');
    }
    updRTUI();return;
  }
  if(left<=3 && left!==lastBeepSec){
    lastBeepSec=left;
    playGymBeep('tick');
  }
  rtSec=left;updRTUI();
}
function stopRT(){clearInterval(rtInt);rtInt=null;rtOn=false;}
function resetRT(){stopRT();rtSec=0;rtEnd=0;sv('rtEnd',0);updRTUI();}
function updRTUI(){
  const d=document.getElementById('rest-hdr-time');if(!d)return;
  if(rtSec>0){d.textContent=fmt(rtSec);d.className='rest-hdr-time'+(rtSec<=10?' warn':'');}
  else{d.textContent='Descanso';d.className='rest-hdr-time idle';}
}
window.setTI=function(s){startRT(s);};
window.toggleTIhdr=function(){
  if(rtOn){stopRT();rtPaused=rtSec;rtEnd=0;sv('rtEnd',0);updRTUI();}
  else if(rtPaused>0){startRT(rtPaused);rtPaused=0;}
  else if(rtSec>0){startRT(rtSec);}
};
window.skipRT=function(){rtPaused=0;resetRT();};

function resumeTimers(){
  if(activeSess)startST();
  if(rtEnd){rtOn=true;clearInterval(rtInt);rtInt=setInterval(syncRT,250);syncRT();}
  else updRTUI();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeTimers();});
window.addEventListener('focus',resumeTimers);
window.addEventListener('pageshow',resumeTimers);

    h+='<div class="start-banner"><p>Entrenamiento de <strong>'+activeSess.toUpperCase()+'</strong> en curso. Finalízalo antes de iniciar otro.</p></div>';

    h+='<div><button class="past-btn" onclick="startPast()">📅 Registrar fecha pasada</button></div></div>';

    if(activeSess===curSess&&activeDate&&activeDate!==today()){
      h+='<div class="late-banner" onclick="openTimeModal(\'active\')">📅 Registrando sesión del <strong>'+activeDate+'</strong>. Toca para editar fecha/hora.</div>';

    h+='<div class="rest-hdr-btns">';
    h+='<button class="rest-hdr-btn" onclick="setTI(60)">1\'00</button>';
    h+='<button class="rest-hdr-btn" onclick="setTI(90)">1\'30</button>';
    h+='<button class="rest-hdr-btn" onclick="setTI(120)">2\'00</button>';
    h+='<button class="rest-hdr-btn" onclick="setTI(150)">2\'30</button>';
    h+='</div><button class="rest-hdr-ios" onclick="triggerIOSTimer()" title="Abrir en Reloj de iPhone">⏰ iOS</button><button class="rest-hdr-skip" onclick="skipRT()">✕</button></div>';
  }

function renderExCard(sk,ex,active){
  const isOpen=!!openCards[ex.id];
  const isBiTri=(ex.b&&(ex.b.includes('bi')||ex.b.includes('tri')))&&ex.n.includes(' + ');
  const subNames=isBiTri?ex.n.split(' + '):null;
  const subSchemes=isBiTri?ex.s.split(' / '):null;

  const mainSess=getSets(sk,ex.id);
  const effSets=mainSess.sets.filter(s=>s.type!=='W');
  const doneEff=effSets.filter(s=>s.done).length;
  const warms=mainSess.sets.filter(s=>s.type==='W').length;
  const planned=countPlanned(ex.s);
  const total=effSets.length||planned;
  const progTxt=total?''+doneEff+'/'+total:'';
  const progDone=total>0&&doneEff===total;
  const warmTxt=warms?'<span class="warm-tag">+'+warms+'W</span>':'';
  const badges=(ex.b||[]).map(b=>'<span class="badge '+BM[b].c+'">'+BM[b].l+'</span>').join('');
  const prev=getPrev(sk,ex.id,ex);

  let body='';
  if(isOpen){
    if(prev&&prev.filter(s=>s.done&&(s.kg||s.reps)).length>0){
      const hint=prev.filter(s=>s.done&&(s.kg||s.reps)).map(s=>(s.kg||'?')+'kg×'+(s.reps||'?')+(s.rir!==undefined&&s.rir!==''?' R'+s.rir:'')).join(' · ');
      body+='<div class="prevhint">↩ Histórico: '+hint+'</div>';
    }
    if(ex.note) body+='<div class="exnote">'+ex.note+'</div>';
    body+=myNoteHTML(ex.n);

    if(!active){
      body+='<div class="readonly-sets">';
      const prevDone=prev?prev.filter(s=>s.done&&(s.kg||s.reps)):[];
      if(prevDone.length){
        prevDone.forEach((s,i)=>{
          const tc=SET_TYPES[s.type||'N'];
          body+='<div class="ro-row"><span class="ro-num">'+(i+1)+'</span><span class="ro-val">'+(s.kg||'—')+' kg × '+(s.reps||'—')+' reps'+(s.rir!==undefined&&s.rir!==''?' · RIR '+s.rir:'')+'</span><span class="ro-badge '+tc.c+'">'+tc.l+'</span></div>';
        });
      } else {
        body+='<div style="font-size:12.5px;color:var(--text3);padding:4px 0">Sin registro previo</div>';
      }
      body+='</div>';
    } else {
      body+='<div class="ex-tools">';
      body+='<button class="ex-tool-btn" onclick="openExModal(\''+sk+'\',\''+ex.id+'\')">🔄 Sustituir</button>';
      body+='<button class="ex-tool-btn" onclick="openPlateCalc()">🧮 Discos</button>';
      body+='<button class="ex-tool-btn" onclick="viewExHistory(\''+encodeURIComponent(ex.n)+'\')">📈 Histórico</button>';
      body+='</div>';

      if(isBiTri&&subNames){
        body+='<div class="setsarea">';
        for(let si=0;si<subNames.length;si++){
          const subId=ex.id+'__'+si;
          const subSch=subSchemes&&subSchemes[si]?subSchemes[si].trim():ex.s;
          const show=ensurePlannedSets(sk,subId,subSch,subNames[si].trim(),null);
          body+='<div class="sub-label">'+subNames[si].trim()+' <span style="font-weight:500;color:var(--text3)">'+subSch+'</span></div>';
          body+=buildSetsTable(sk,subId,show,null);
          body+='<button class="addsetbtn" onclick="addSet(\''+sk+'\',\''+subId+'\')">+ Serie '+subNames[si].trim().split(' ')[0]+'</button>';
        }
        body+='</div>';
      } else {
        const show=ensurePlannedSets(sk,ex.id,ex.s,ex.n,ex);
        body+='<div class="setsarea">';
        body+=buildSetsTable(sk,ex.id,show,ex);
        body+='<button class="addsetbtn" onclick="addSet(\''+sk+'\',\''+ex.id+'\')">+ Añadir serie</button>';
        body+='</div>';
      }
    }
  }

  let out='<div class="exc'+(isOpen?' open':'')+'" id="exc-'+ex.id+'">';
  out+='<div class="exh" onclick="togCard(\''+ex.id+'\')"><span class="exname">'+ex.n+(exNotes[ex.n]?' 📝':'')+'</span>';
  out+='<div class="exright">';
  const pbN=countPBToday(sk,ex.id);
  if(pbN)out+='<span class="pbtag">🏆'+(pbN>1?pbN:'')+'</span>';
  if(progTxt)out+='<span class="exprog'+(progDone?' done':'')+'">'+progTxt+'</span>'+warmTxt;
  out+='<span class="exscheme">'+ex.s+'</span><span class="exarrow">▾</span></div></div>';
  if(ex.b&&ex.b.length)out+='<div class="exbadges">'+badges+'</div>';
  if(isOpen)out+=body;
  out+='</div>';
  return out;
}

// ─── ANALYTICS & WHOOP DASHBOARD (PROGRESS) ──────────────────────────────────
function computePRWall(){
  const targetLifts=[
    {title:'Press Banca',keys:['press banca plano']},
    {title:'Sentadilla',keys:['sentadilla barra','sentadilla multipower','sentadilla hack']},
    {title:'Press Militar',keys:['press militar']},
    {title:'Remo en T',keys:['remo en t']},
    {title:'Peso Muerto Rum.',keys:['peso muerto rumano']},
    {title:'Press Cerrado',keys:['agarre cerrado','press cerrado']}
  ];
  return targetLifts.map(tl=>{
    let bestKg=0, bestReps=0, bestE1RM=0, bestDate='';
    Object.keys(sessions).forEach(dk=>{
      const date=dk.split('_')[0];
      Object.keys(sessions[dk]).forEach(xid=>{
        if(xid==='__note__')return;
        const nm=normName(exDisplayName(dk,xid));
        if(tl.keys.some(k=>nm.includes(k))){
          const sets=(sessions[dk][xid].sets||[]).filter(s=>s.done&&s.type!=='W');
          sets.forEach(s=>{
            const k=parseFloat(s.kg)||0, r=parseInt(s.reps)||0;
            if(k>0 && r>0){
              const e1=Math.round(k*(1+r/30)*10)/10;
              if(k>bestKg || (k===bestKg && r>bestReps)){bestKg=k;bestReps=r;bestDate=date;}
              if(e1>bestE1RM) bestE1RM=e1;
            }
          });
        }
      });
    });
    return {title:tl.title,kg:bestKg,reps:bestReps,e1rm:bestE1RM,date:bestDate};
  });
}

function drawPgChart(){
  const c=document.getElementById('pg-chart');if(!c)return;
  const d=window._pgData||{};
  const met=(document.getElementById('pg-met')||{}).value||'e1rm';
  const ctx=c.getContext('2d');const W=c.offsetWidth||300,H=190;c.width=W;c.height=H;
  const dates=new Set();Object.values(d).forEach(ex=>ex.logs.forEach(l=>dates.add(l.date)));
  const ds=[...dates].sort();if(!ds.length){ctx.clearRect(0,0,W,H);return;}
  const COLS=['#00F0FF','#B8FF3B','#3B82F6','#EC4899','#F59E0B'];
  const ser=[];const nms=[];let ci=0;
  Object.values(d).slice(0,5).forEach(ex=>{
    const pts=ds.map(dt=>{
      const l=ex.logs.find(x=>x.date===dt);if(!l)return null;
      if(met==='vol') return l.sets.reduce((s,r)=>s+(parseFloat(r.kg)||0)*(parseInt(r.reps)||1),0);
      if(met==='max') return Math.max(...l.sets.map(r=>parseFloat(r.kg)||0));
      return Math.max(...l.sets.map(r=>(parseFloat(r.kg)||0)*(1+(parseInt(r.reps)||0)/30)));
    });
    ser.push({pts,col:COLS[ci%5]});nms.push({name:ex.name.substring(0,22),col:COLS[ci%5]});ci++;
  });
  const P={t:14,r:10,b:26,l:40};const cw=W-P.l-P.r,ch=H-P.t-P.b;
  let mx=0;ser.forEach(s=>s.pts.forEach(p=>{if(p!==null&&p>mx)mx=p;}));if(!mx)mx=1;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=P.t+ch*(1-i/4);ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.fillStyle='#6B7280';ctx.font='600 11px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(mx*i/4),P.l-6,y+4);}
  const st=Math.max(1,Math.floor(ds.length/5));ctx.fillStyle='#6B7280';ctx.font='600 11px -apple-system,sans-serif';ctx.textAlign='center';
  ds.forEach((dt,i)=>{if(i%st!==0&&i!==ds.length-1)return;const x=P.l+(ds.length===1?cw/2:cw*i/(ds.length-1));ctx.fillText(dt.substring(5),x,H-4);});
  ser.forEach(s=>{
    ctx.beginPath();ctx.strokeStyle=s.col;ctx.lineWidth=2.5;ctx.lineJoin='round';let st2=false;
    s.pts.forEach((p,i)=>{if(p===null)return;const x=P.l+(ds.length===1?cw/2:cw*i/(ds.length-1));const y=P.t+ch*(1-p/mx);if(!st2){ctx.moveTo(x,y);st2=true;}else ctx.lineTo(x,y);});
    ctx.stroke();
    s.pts.forEach((p,i)=>{if(p===null)return;const x=P.l+(ds.length===1?cw/2:cw*i/(ds.length-1));const y=P.t+ch*(1-p/mx);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle=s.col;ctx.fill();});
  });
  const lg=document.getElementById('pg-chart-leg');if(lg)lg.innerHTML=nms.map(e=>'<div class="clitem"><div class="cldot" style="background:'+e.col+'"></div>'+e.name+'</div>').join('');
  const lb=document.getElementById('pg-chart-lbl');if(lb)lb.textContent=met==='e1rm'?'1RM Estimado (kg)':(met==='vol'?'Volumen Total (kg)':'Carga Máxima (kg)');
}

function drawRadar(fromS, canvasId){
  const c=document.getElementById(canvasId||'radar-c');if(!c)return;
  const ctx=c.getContext('2d');const W=c.offsetWidth||300,H=285;c.width=W;c.height=H;
  const groups=['Pecho','Hombros','Espalda','Tríceps','Bíceps','Pierna'];
  const cnt=[0,0,0,0,0,0];

  Object.keys(sessions).forEach(dk=>{
    const date=dk.split('_')[0];
    if(date<fromS)return;
    Object.keys(sessions[dk]).forEach(xid=>{
      if(xid==='__note__')return;
      const e=sessions[dk][xid];if(!e||!e.sets)return;
      const eff=e.sets.filter(s=>s.done&&s.type!=='W').length;
      if(!eff)return;
      const m=muscleOf(exDisplayName(dk,xid));
      if(m==='Pecho') cnt[0]+=eff;
      else if(m==='Hombros') cnt[1]+=eff;
      else if(m==='Espalda') cnt[2]+=eff;
      else if(m==='Tríceps') cnt[3]+=eff;
      else if(m==='Bíceps') cnt[4]+=eff;
      else if(m==='Cuádriceps'||m==='Isquios/Glúteos'||m==='Gemelos') cnt[5]+=eff;
    });
  });

  const mx=Math.max(...cnt,10);
  const N=6,CX=W/2,CY=H/2,R=Math.min(W,H)/2-68;
  ctx.clearRect(0,0,W,H);

  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)';
    ctx.lineWidth=1;
    for(let i=0;i<N;i++){
      const a=Math.PI*2*i/N-Math.PI/2;
      const r=R*ring/4;
      i===0?ctx.moveTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r):ctx.lineTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r);
    }
    ctx.closePath();ctx.stroke();
  }
  for(let i=0;i<N;i++){
    const a=Math.PI*2*i/N-Math.PI/2;
    ctx.beginPath();ctx.strokeStyle=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)';
    ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(a)*R,CY+Math.sin(a)*R);ctx.stroke();
  }

  const grad=ctx.createRadialGradient(CX,CY,10,CX,CY,R);
  grad.addColorStop(0,'rgba(0,240,255,0.35)');
  grad.addColorStop(1,'rgba(184,255,59,0.18)');
  ctx.beginPath();ctx.fillStyle=grad;ctx.strokeStyle='#00F0FF';ctx.lineWidth=2.5;
  for(let i=0;i<N;i++){
    const a=Math.PI*2*i/N-Math.PI/2;
    const r=R*(cnt[i]/mx);
    i===0?ctx.moveTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r):ctx.lineTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r);
  }
  ctx.closePath();ctx.fill();ctx.stroke();

  for(let i=0;i<N;i++){
    const a=Math.PI*2*i/N-Math.PI/2;
    const r=R*(cnt[i]/mx);
    ctx.beginPath();ctx.arc(CX+Math.cos(a)*r,CY+Math.sin(a)*r,4.5,0,Math.PI*2);ctx.fillStyle='#B8FF3B';ctx.fill();
    const lr=R+34;
    const x=CX+Math.cos(a)*lr,y=CY+Math.sin(a)*lr;
    ctx.fillStyle=isDark?'#F3F4F6':'#111827';ctx.font='700 11.5px -apple-system,sans-serif';ctx.textAlign='center';
    ctx.fillText(groups[i],x,y);
    ctx.fillStyle='#00F0FF';ctx.font='800 11px -apple-system,sans-serif';
    ctx.fillText(cnt[i]+' series',x,y+13);
  }
}

      h+='</div>';
    });
  }
  h+='</div>';return h;
}

function drawWChart(){
  const c=document.getElementById('w-chart');if(!c)return;
  const ctx=c.getContext('2d');const W=c.offsetWidth||300,H=180;c.width=W;c.height=H;
  const data=[...weightLog].sort((a,b)=>a.date.localeCompare(b.date));if(!data.length)return;
  const vals=data.map(d=>parseFloat(d.kg));const mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
  const P={t:12,r:10,b:26,l:38};const cw=W-P.l-P.r,ch=H-P.t-P.b;
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<=4;i++){const y=P.t+ch*(1-i/4);ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.fillStyle='#6B7280';ctx.font='600 11px -apple-system,sans-serif';ctx.textAlign='right';ctx.fillText((mn+(mx-mn)*i/4).toFixed(1),P.l-4,y+4);}
  ctx.beginPath();ctx.strokeStyle='#B8FF3B';ctx.lineWidth=2.5;ctx.lineJoin='round';
  data.forEach((d,i)=>{const x=P.l+(data.length===1?cw/2:cw*i/(data.length-1));const y=P.t+ch*(1-(parseFloat(d.kg)-mn)/(mx-mn));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  data.forEach((d,i)=>{const x=P.l+(data.length===1?cw/2:cw*i/(data.length-1));const y=P.t+ch*(1-(parseFloat(d.kg)-mn)/(mx-mn));ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle='#B8FF3B';ctx.fill();});
}

function e1rm(k,r){return k*(1+r/30);}
function setDeltaHTML(s,p){
  if(!p)return '';
  const pk=parseFloat(p.kg)||0,pr=parseInt(p.reps)||0;
  if(!pk&&!pr)return '';
  let t='↩ '+(p.kg||'?')+'kg×'+(p.reps||'?')+(p.rir!==undefined&&p.rir!==''?' · R'+p.rir:'');
  const ck=parseFloat(s.kg)||0,cr=parseInt(s.reps)||0;
  if(ck&&cr&&pk&&pr&&(ck!==pk||cr!==pr)){
    const a=e1rm(ck,cr),b=e1rm(pk,pr);
    const better=a>b*1.005,worse=a<b*0.995;
    const dk=Math.round((ck-pk)*10)/10,dr=cr-pr;
    const parts=[];
    if(dk)parts.push((dk>0?'+':'')+dk+'kg');
    if(dr)parts.push((dr>0?'+':'')+dr+' reps');
    t+=' <span class="'+(better?'dl-up':worse?'dl-dn':'')+'">'+(better?'▲ ':worse?'▼ ':'')+parts.join(' · ')+'</span>';
  }
  return t;
}
function refreshDelta(sk,exId,idx){
  const el=document.getElementById('dl-'+sk+'-'+exId+'-'+idx);if(!el)return;
  const pvAll=getPrev(sk,exId,null);const pv=pvAll?pvAll.filter(x=>x.done||x.kg||x.reps):null;
  const s=getSets(sk,exId).sets[idx];
  el.innerHTML=(pv&&pv[idx]&&s)?setDeltaHTML(s,pv[idx]):'';
}

function checkPB(sk,exId,idx){
  const sess=getSets(sk,exId);const s=sess.sets[idx];
  if(!s||s.type==='W')return null;
  const kg=parseFloat(s.kg)||0,reps=parseInt(s.reps)||0;
  if(kg<=0||reps<=0)return null;
  const curDk=wDate()+'_'+sk;
  const name=normName(exDisplayName(curDk,exId));
  let maxKg=0,repsAtKg=0,any=false;
  Object.keys(sessions).forEach(dk=>{
    Object.keys(sessions[dk]).forEach(xid=>{
      if(xid==='__note__')return;
      const e=sessions[dk][xid];if(!e||!e.sets)return;
      if(normName(exDisplayName(dk,xid))!==name)return;
      e.sets.forEach((t,i)=>{
        if(dk===curDk&&xid===exId&&i===idx)return;
        if(!t.done||t.type==='W')return;
        const k=parseFloat(t.kg)||0,r=parseInt(t.reps)||0;
        if(k<=0||r<=0)return;
        any=true;if(k>maxKg)maxKg=k;if(k===kg&&r>repsAtKg)repsAtKg=r;
      });
    });
  });
  if(!any)return null;
  if(kg>maxKg)return {text:'¡Nuevo Récord de Peso! '+kg+' kg'};
  if(repsAtKg>0&&reps>repsAtKg)return {text:'¡Récord de Reps con '+kg+' kg! ('+reps+')'};
  return null;
}
function countPBToday(sk,exId){
  const dk=wDate()+'_'+sk;const d=sessions[dk];if(!d)return 0;
  let n=0;
  Object.keys(d).forEach(k=>{if(k===exId||k.indexOf(exId+'__')===0){const e=d[k];if(e&&e.sets)n+=e.sets.filter(s=>s.pb&&s.done).length;}});
  return n;
}

function myNoteHTML(name){
  const v=exNotes[name]||'';
  return '<div class="mynote"><textarea class="mynote-txt" rows="1" placeholder="📝 Nota personal (ej. posición banco 4, agarre ancho...)" data-exn="'+encodeURIComponent(name)+'" onchange="saveExNote(this)">'+esc(v)+'</textarea></div>';
}
window.saveExNote=function(el){
  const n=decodeURIComponent(el.dataset.exn);const v=el.value.trim();
  if(v)exNotes[n]=v;else delete exNotes[n];
  sv('exNotes',exNotes);toast('Nota guardada');
};

function muscleOf(name){
  const n=normName(name);
  if(/antebrazo|muneca|farmer|agarre pesad/.test(n))return 'Antebrazo';
  if(/abdominal|crunch|plancha|hollow|rueda|elevaciones (de )?piernas|encogimientos/.test(n))return 'Core';
  if(/gemelo/.test(n))return 'Gemelos';
  if(/sentadilla|prensa|extension (de )?cuadriceps|zancada|bulgara|hack/.test(n))return 'Cuádriceps';
  if(/peso muerto|isquio|femoral|hip thrust|rumano|gluteo/.test(n))return 'Isquios/Glúteos';
  if(/triceps|pushdown|frances|agarre cerrado|press cerrado|fondos paralelas|patadas|overhead|extension polea/.test(n))return 'Tríceps';
  if(/curl|predicador|bayesian/.test(n))return 'Bíceps';
  if(/elev[a-z]*\.? *lateral|elev[a-z]*\.? *frontal|pajaros|face ?pull|facepull|press militar|remo al menton|y-pull/.test(n))return 'Hombros';
  if(/dominada|jalon|remo|pull-?over|pullover|dorsal/.test(n))return 'Espalda';
  if(/press|aperturas|cruces|fondos|pecho/.test(n))return 'Pecho';
  return 'Otros';
}
function weekStartStr(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return dstr(x);}
function weeklyVolume(){
  const ws0=weekStartStr(new Date());
  const d1=new Date(ws0+'T12:00:00');d1.setDate(d1.getDate()-7);
  const ws1=dstr(d1);
  const cur={},prv={};
  Object.keys(sessions).forEach(dk=>{
    const date=dk.slice(0,10);if(date<ws1)return;
    Object.keys(sessions[dk]).forEach(xid=>{
      if(xid==='__note__')return;
      const e=sessions[dk][xid];if(!e||!e.sets)return;
      const n=e.sets.filter(s=>s.done&&s.type!=='W').length;if(!n)return;
      const m=muscleOf(exDisplayName(dk,xid));
      const t=date>=ws0?cur:prv;t[m]=(t[m]||0)+n;
    });
  });
  return {cur:cur,prv:prv};
}
function volumeHTML(){
  const v=weeklyVolume();
  const order=['Pecho','Espalda','Hombros','Bíceps','Tríceps','Cuádriceps','Isquios/Glúteos','Gemelos','Core'];
  const MAX=22;
  let h='<div class="chartbox"><div class="charttitle"><span>Series Semanales por Músculo</span><span style="color:var(--pull)">Óptimo: 10–20</span></div>';
  h+='<div class="vol-legend"><span><i class="vl-cur"></i>Esta semana</span><span><i class="vl-prv"></i>Semana pasada</span></div>';
  order.forEach(m=>{
    const c=v.cur[m]||0,p=v.prv[m]||0;
    h+='<div class="vol-row"><div class="vol-name">'+m+'</div><div class="vol-bars">';
    h+='<div class="vol-track"><div class="vol-band" style="left:'+(10/MAX*100)+'%;width:'+(10/MAX*100)+'%"></div><div class="vol-fill cur" style="width:'+Math.min(100,c/MAX*100)+'%"></div></div>';
    h+='<div class="vol-track thin"><div class="vol-fill prv" style="width:'+Math.min(100,p/MAX*100)+'%"></div></div>';
    h+='</div><div class="vol-num"><b>'+c+'</b><span>'+p+'</span></div></div>';
  });
  h+='</div>';return h;
}

function backupDue(){
  if(activeSess||completed.length<3)return null;
  if(backupSnooze&&backupSnooze>today())return null;
  if(!lastBackup)return {never:true};
  const days=Math.floor((new Date(today()+'T12:00:00')-new Date(lastBackup+'T12:00:00'))/86400000);
  return days>=21?{days:days}:null;
}
function backupBannerHTML(){
  const d=backupDue();if(!d)return '';
  const txt=d.never?'Aún no has descargado una copia de seguridad.':'Hace '+d.days+' días desde tu último backup.';
  return '<div class="backup-banner"><div class="bb-txt">💾 '+txt+'</div><button class="bb-go" onclick="goBackup()">Guardar</button><button class="bb-x" onclick="snoozeBackup()">Luego</button></div>';
}
window.goBackup=function(){profTab='backup';showView('profile');};
window.snoozeBackup=function(){const d=new Date();d.setDate(d.getDate()+4);backupSnooze=dstr(d);sv('backupSnooze',backupSnooze);render();};

function downloadText(text,mime,filename){
  const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}
window.exportCSV=function(kind){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[];
  if(kind==='workouts'){
    rows.push(['Fecha','Sesión','Detalle','Duración (min)']);
    [...completed].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>rows.push([w.date,w.label,w.sub,w.dur?Math.round(w.dur/60):'']));
  } else {
    rows.push(['Fecha','Sesión','Ejercicio','Serie','Tipo','Kg','Reps','RIR']);
    Object.keys(sessions).sort().forEach(dk=>{
      const date=dk.slice(0,10),sid=dk.slice(11),sd=ALL_SESSIONS.find(s=>s.id===sid);
      Object.keys(sessions[dk]).forEach(xid=>{
        if(xid==='__note__')return;
        const e=sessions[dk][xid];if(!e||!e.sets)return;
        const nm=exDisplayName(dk,xid);
        e.sets.forEach((s,i)=>{if(s.done)rows.push([date,sd?sd.label:sid,nm,i+1,SET_TYPES[s.type||'N'].n,String(s.kg||'').replace('.',','),s.reps||'',s.rir||'']);});
      });
    });
  }
  downloadText('\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8','rutina-'+kind+'-'+today()+'.csv');
  toast('CSV exportado');
};

let pendTime=null;
function moveSessionData(fromDate,toDate,sessId){
  const a=fromDate+'_'+sessId,b=toDate+'_'+sessId;
  if(a===b||!sessions[a])return true;
  sessions[b]=sessions[a];delete sessions[a];saveSess();return true;
}
window.openTimeModal=function(mode,idx,liveDef){
  let date,secs,fixed=false;
  if(mode==='active'){if(!activeSess)return;date=activeDate||today();secs=stSec;fixed=stFixed!==null;}
  else{const w=completed[idx];if(!w)return;date=w.date;secs=w.dur||0;}
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  pendTime={mode:mode,idx:idx,date:date,h:h,m:m};
  const live=(liveDef===undefined)?!fixed:liveDef;
  let inner='<div class="modal-bg" onclick="if(event.target===this)closeTimeModal()"><div class="modal">';
  inner+='<div class="modal-title">Fecha y Duración</div>';
  inner+='<div class="input-row"><label>Fecha</label><input class="prof-inp" type="date" id="tm-date" max="'+today()+'" value="'+date+'"></div>';
  inner+='<div class="input-row"><label>Duración</label><input class="prof-inp tm-num" type="number" min="0" max="23" id="tm-h" value="'+h+'"><span class="tm-unit">h</span><input class="prof-inp tm-num" type="number" min="0" max="59" id="tm-m" value="'+m+'"><span class="tm-unit">min</span></div>';
  if(mode==='active') inner+='<label class="tm-check"><input type="checkbox" id="tm-live"'+(live?' checked':'')+'> Contar en vivo</label>';
  inner+='<button class="msave-btn" onclick="saveTimeModal()">Guardar</button><button class="modal-cancel" onclick="closeTimeModal()">Cancelar</button></div></div>';
  const mm=document.getElementById('modal-time');mm.innerHTML=inner;mm.style.display='block';
};
window.closeTimeModal=function(){document.getElementById('modal-time').style.display='none';pendTime=null;};
window.saveTimeModal=function(){
  if(!pendTime)return;const p=pendTime;
  const d=(document.getElementById('tm-date').value||'').trim();
  const hh=parseInt(document.getElementById('tm-h').value)||0,mi=parseInt(document.getElementById('tm-m').value)||0;
  const secs=hh*3600+mi*60,changedDur=(hh!==p.h||mi!==p.m);
  if(p.mode==='active'){
    if(d!==p.date){if(!moveSessionData(p.date,d,activeSess))return;activeDate=d;sv('activeDate',d);}
    const live=(document.getElementById('tm-live')||{}).checked;
    const newSecs=changedDur?secs:stSec;stopST();
    if(live){stFixed=null;stSec=newSecs;stStart=Date.now()-newSecs*1000;}else{stFixed=newSecs;stSec=newSecs;}
    sv('stFixed',stFixed);sv('stStart',stStart);sv('stSec',stSec);startST();
  } else {
    const w=completed[p.idx];if(!w){closeTimeModal();return;}
    if(d!==w.date){if(!moveSessionData(w.date,d,w.sessId))return;w.date=d;}
    if(changedDur)w.dur=secs;sv('completed',completed);
  }
  closeTimeModal();toast('Actualizado');render();
};

const BACKUP_KEYS=['sessions','customEx','completed','weightLog','measLog','photoLog','curSess','curFolder','isDark','openCards','exNotes'];
window.exportBackup=function(skipPhotos){
  const data={_app:'rutina-gimnasio-angel',_version:1,_exported:new Date().toISOString(),data:{}};
  BACKUP_KEYS.forEach(k=>{if(skipPhotos&&k==='photoLog')return;const raw=localStorage.getItem('rv7_'+k);if(raw!=null)data.data[k]=raw;});
  downloadText(JSON.stringify(data),'application/json','rutina-backup-'+today()+'.json');
  lastBackup=today();sv('lastBackup',lastBackup);toast('Backup JSON descargado');
};
window.importBackup=function(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const parsed=JSON.parse(ev.target.result);
      if(!parsed||!parsed.data||parsed._app!=='rutina-gimnasio-angel'){toast('Archivo no válido');return;}
      showConfirmModal('Restaurar Copia','¿Sustituir todos los datos actuales por los de esta copia de seguridad?','Restaurar',false,function(){
        Object.keys(parsed.data).forEach(k=>{if(BACKUP_KEYS.indexOf(k)>=0)localStorage.setItem('rv7_'+k,parsed.data[k]);});
        localStorage.setItem('rv7_activeSess',JSON.stringify(''));
        localStorage.setItem('rv7_curFolder',JSON.stringify('vtaper_v11'));
        localStorage.setItem('rv7_curSess',JSON.stringify('v11_upper1'));
        toast('Backup restaurado');setTimeout(()=>location.reload(),500);
      });
    }catch(err){toast('Error al leer JSON');}
  };
  r.readAsText(file);
};

window.saveWeight=function(){
  const v=parseFloat((document.getElementById('w-inp')||{}).value);if(isNaN(v)||v<30||v>300){toast('Peso no válido');return;}
  const idx=weightLog.findIndex(w=>w.date===today());if(idx>=0)weightLog[idx].kg=v;else weightLog.push({date:today(),kg:v});
  sv('weightLog',weightLog);toast('Peso registrado: '+v+' kg');render();
};
window.saveMeas=function(){
  const fields=['pecho','brazoI','brazoD','cintura','cadera','piernaI','piernaD','gemI','gemD'];
  const entry={date:today()};let any=false;
  fields.forEach(k=>{const el=document.getElementById('m-'+k);if(el&&el.value){entry[k]=parseFloat(el.value);any=true;}});
  if(!any){toast('Introduce alguna medida');return;}
  const idx=measLog.findIndex(m=>m.date===today());if(idx>=0)Object.assign(measLog[idx],entry);else measLog.push(entry);
  sv('measLog',measLog);toast('Medidas guardadas');render();
};

function applyTheme(){document.body.classList.toggle('light',!isDark);const b=document.getElementById('theme-btn');if(b)b.textContent=isDark?'☀️':'🌙';}
window.toggleTheme=function(){isDark=!isDark;sv('isDark',isDark);applyTheme();render();};

applyTheme();
if(activeSess)startST();
if(rtEnd){rtOn=true;rtInt=setInterval(syncRT,250);syncRT();}
render();
